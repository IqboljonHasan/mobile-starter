<style>
:root {
  --page-bg: #E8ECF2;
  --panel-text: #0B1B2E;
  --panel-muted: #5B6B80;
  --panel-item-bg: #FFFFFF;
  --panel-item-active-bg: #0B1B2E;
  --panel-item-active-text: #FFFFFF;
  --device-shadow: 0 30px 80px rgba(11, 27, 46, 0.22), 0 0 0 10px #0B1B2E;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page-bg: #0E141D;
    --panel-text: #E8EEF6;
    --panel-muted: #8E9DB0;
    --panel-item-bg: #18212D;
    --panel-item-active-bg: #E8EEF6;
    --panel-item-active-text: #0B1B2E;
    --device-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), 0 0 0 10px #000000;
  }
}
:root[data-theme="dark"] {
  --page-bg: #0E141D;
  --panel-text: #E8EEF6;
  --panel-muted: #8E9DB0;
  --panel-item-bg: #18212D;
  --panel-item-active-bg: #E8EEF6;
  --panel-item-active-text: #0B1B2E;
  --device-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), 0 0 0 10px #000000;
}

html, body { margin: 0; height: 100%; }
body {
  background: var(--page-bg);
  font-family: 'Manrope', system-ui, sans-serif;
  color: var(--panel-text);
  overflow: hidden;
}

/* styles shared by every screen (from the design files) */
.device a { color: #0B1B2E; transition: transform .12s ease; }
.device a:hover { color: #0B1B2E; }
.device a[href]:active { transform: scale(0.98); }
.device input::placeholder, .device textarea::placeholder { color: #8A97A8; }
.device button:focus-visible, .device a:focus-visible, .device input:focus-visible, .device textarea:focus-visible {
  outline: 2px solid #1556C9; outline-offset: 2px;
}

.layout {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center; gap: 56px;
}
.panel { width: 220px; flex: none; }
.panel h1 { margin: 0 0 4px; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
.panel p { margin: 0 0 20px; font-size: 13px; line-height: 19px; color: var(--panel-muted); }
.panel ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.panel button {
  width: 100%; min-height: 44px; padding: 0 16px; border: none; border-radius: 14px;
  background: var(--panel-item-bg); color: var(--panel-text);
  font: 700 14px/1.2 'Manrope', system-ui, sans-serif; text-align: left; cursor: pointer;
}
.panel button[aria-current="true"] { background: var(--panel-item-active-bg); color: var(--panel-item-active-text); }

.stage { position: relative; flex: none; width: 390px; height: 844px; transform-origin: center center; }
.device {
  position: absolute; inset: 0; overflow: hidden; border-radius: 44px;
  box-shadow: var(--device-shadow); background: #1556C9;
}
.screen { position: absolute; inset: 0; }
.screen.is-under { visibility: hidden; }
.screen.enter { animation: enter .3s cubic-bezier(.2, .8, .2, 1) both; }
.screen.leave { animation: leave .22s ease-in both; pointer-events: none; }
@keyframes enter { from { opacity: 0; transform: translateY(48px); } to { opacity: 1; transform: none; } }
@keyframes leave { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(48px); } }
@media (prefers-reduced-motion: reduce) {
  .screen.enter, .screen.leave { animation-duration: .01s; }
}

.toast {
  position: absolute; z-index: 60; left: 50%; bottom: 128px;
  transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
  max-width: calc(100% - 48px); box-sizing: border-box;
  padding: 12px 18px; border-radius: 22px;
  background: #0B1B2E; color: #FFFFFF;
  font: 700 14px/20px 'Manrope', system-ui, sans-serif; white-space: nowrap;
  box-shadow: 0 10px 30px rgba(11, 27, 46, 0.3);
  transition: opacity .2s ease, transform .2s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* phone-sized viewports: no frame, no side panel, fill the screen */
@media (max-width: 760px) {
  .panel { display: none; }
  .device { border-radius: 0; box-shadow: none; }
  body { background: #1556C9; }
}
</style>
</head>

      oilaga: { name: 'Oilaga', bg: '#FFE3CF', fg: '#C2410C', balance: 9320000 },
      biznes: { name: 'Biznes', bg: '#DCE8FF', fg: '#1D4ED8', balance: 4660000 },
      ota: { name: 'Ota-onamga', bg: '#FCE1EE', fg: '#BE185D', balance: 2330000 },
      xayriya: { name: 'Xayriya', bg: '#D8F5E1', fg: '#15803D', balance: 932000 },
      shaxsiy: { name: 'Shaxsiy rivojlanish', bg: '#E9E0FF', fg: '#6D28D9', balance: 1398000 }
    };
    var wid = st.wallet || 'oilaga';
    var wd = WALLETS[wid];
    var w = {
      name: wd.name, bg: wd.bg, fg: wd.fg,
      balance: self.fmt(wd.balance) + " so'm",
      isOilaga: wid === 'oilaga', isBiznes: wid === 'biznes', isOta: wid === 'ota', isXayriya: wid === 'xayriya', isShaxsiy: wid === 'shaxsiy'
    };

    var TERMS = [
      { id: 'week', name: '1 hafta', due: '28-oktabr, 2026' },
      { id: 'month', name: '1 oy', due: '21-noyabr, 2026' },
      { id: 'quarter', name: '3 oy', due: '21-yanvar, 2027' },
      { id: 'none', name: 'Muddatsiz', due: '' }
    ];
    var current = TERMS.filter(function (t) { return t.id === term; })[0];
    var terms = TERMS.map(function (t) {
      var on = t.id === term;
      return {
        name: t.name,
        checked: on ? 'true' : 'false',
        bg: on ? '#0B1B2E' : '#F1F4F8',
        color: on ? '#FFFFFF' : '#0B1B2E',
        pick: function () { self.setState({ term: on ? '' : t.id }); }
      };
    });

    var dueText = 'Sanani tanlang';
    var dueColor = '#8A97A8';
    if (current && current.due) { dueText = current.due; dueColor = '#0B1B2E'; }
    else if (current) { dueText = 'Muddatsiz'; dueColor = '#0B1B2E'; }

    return {
      cardChecked: isCard ? 'true' : 'false',
      cashChecked: isCard ? 'false' : 'true',
      cardBg: isCard ? '#0B1B2E' : 'transparent',
      cardColor: isCard ? '#FFFFFF' : '#0B1B2E',
      cashBg: isCard ? 'transparent' : '#0B1B2E',
      cashColor: isCard ? '#0B1B2E' : '#FFFFFF',
      pickCard: function () { self.setState({ method: 'card' }); },
      pickCash: function () { self.setState({ method: 'cash' }); },
      amountText: digits ? self.fmt(amount) : '',
      onAmount: function (e) { self.setState({ amount: String(e.target.value || '').replace(/\D/g, '').slice(0, 12) }); },
      terms: terms,
      w: w,
      dueText: dueText,
      dueColor: dueColor,
      hasDue: !current || current.id !== 'none',
      remind: {
        checked: remindOn ? 'true' : 'false',
        bg: remindOn ? '#0B1B2E' : '#CBD3DE',
        x: remindOn ? 22 : 2,
        toggle: function () { self.setState({ remind: !remindOn }); }
      }
    };
  }
}
return Component;
} };

  Object.keys(SCREENS).forEach(function (r) {
    SCREENS[r].tpl = document.getElementById('tpl-' + r);
    SCREENS[r].Comp = SCREENS[r].make(DCLogic);
  });

  function paint(entry) {
    var root = entry.el;
    var active = document.activeElement;
    var focusId = active && root.contains(active) && active.id ? active.id : null;
    var scrolls = {};
    root.querySelectorAll('[data-scroll]').forEach(function (e) { scrolls[e.getAttribute('data-scroll')] = [e.scrollTop, e.scrollLeft]; });
    var drafts = {};
    root.querySelectorAll('input[id]:not([data-controlled]), textarea[id]').forEach(function (e) { drafts[e.id] = e.value; });

    var vals = entry.comp.renderVals ? entry.comp.renderVals() : {};
    var frag = document.createDocumentFragment();
    renderInto(SCREENS[entry.route].tpl.content, vals || {}, frag, { scroll: 0 });
    root.replaceChildren(frag);

    root.querySelectorAll('[data-scroll]').forEach(function (e) {
      var p = scrolls[e.getAttribute('data-scroll')];
      if (p) { e.scrollTop = p[0]; e.scrollLeft = p[1]; }
    });
    Object.keys(drafts).forEach(function (id) {
      var e = root.querySelector('#' + CSS.escape(id));
      if (e && !e.hasAttribute('data-controlled')) e.value = drafts[id];
    });
    if (focusId) {
      var f = root.querySelector('#' + CSS.escape(focusId));
      if (f) {
        f.focus({ preventScroll: true });
        if (typeof f.setSelectionRange === 'function' && typeof f.value === 'string') {
          try { f.setSelectionRange(f.value.length, f.value.length); } catch (err) { /* not a text field */ }
        }
      }
    }
  }

  /* ---------- navigation stack ---------- */
  var screensEl = document.getElementById('screens');
  var stack = [];

  function makeEntry(route, params) {
    var def = SCREENS[route];
    var comp = new def.Comp();
    if (params) comp.state = Object.assign({}, params);
    var el = document.createElement('div');
    el.className = 'screen';
    el.setAttribute('data-route', route);
    var entry = { route: route, comp: comp, el: el };
    comp.__paint = function () { paint(entry); };
    paint(entry);
    return entry;
  }

  function settle() {
    stack.forEach(function (e, i) {
      var top = i === stack.length - 1;
      e.el.classList.toggle('is-under', !top);
      if (top) { e.el.removeAttribute('inert'); e.el.removeAttribute('aria-hidden'); }
      else { e.el.setAttribute('inert', ''); e.el.setAttribute('aria-hidden', 'true'); }
    });
    var cur = stack[stack.length - 1];
    document.querySelectorAll('[data-jump]').forEach(function (b) {
      b.setAttribute('aria-current', b.getAttribute('data-jump') === cur.route ? 'true' : 'false');
    });
    try { history.replaceState(null, '', '#' + cur.route); } catch (err) { /* file:// or sandbox */ }
  }

  function go(route, params) {
    if (!SCREENS[route]) { toast('Bu ekran hali chizilmagan'); return; }
    var entry = makeEntry(route, params);
    screensEl.appendChild(entry.el);
    stack.push(entry);
    entry.el.classList.add('enter');
    entry.el.addEventListener('animationend', function done() {
      entry.el.classList.remove('enter');
      entry.el.removeEventListener('animationend', done);
    });
    settle();
  }

  function back(fallback) {
    if (stack.length < 2) {
      if (fallback && SCREENS[fallback]) reset(fallback);
      return;
    }
    var top = stack.pop();
    settle();
    top.el.classList.add('leave');
    top.el.setAttribute('inert', '');
    setTimeout(function () { top.el.remove(); }, 230);
  }

  function reset(route) {
    stack.forEach(function (e) { e.el.remove(); });
    stack = [];
    var home = makeEntry('asosiy');
    screensEl.appendChild(home.el);
    stack.push(home);
    if (route && route !== 'asosiy') go(route);
    else settle();
  }

  /* ---------- toast ---------- */
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  /* ---------- wiring: clicks, swipe, side panel ---------- */
  document.getElementById('device').addEventListener('click', function (e) {
    var t = e.target.closest('[data-back],[data-save],[data-toast],[data-go],a[href^="#"]');
    if (!t) return;
    e.preventDefault();
    if (t.hasAttribute('data-back')) { back((t.getAttribute('href') || '').slice(1)); return; }
    if (t.hasAttribute('data-save')) { var m = t.getAttribute('data-save'); back(); setTimeout(function () { toast(m); }, 120); return; }
    if (t.hasAttribute('data-toast')) { toast(t.getAttribute('data-toast')); return; }
    var route = t.getAttribute('data-go') || (t.getAttribute('href') || '').slice(1);
    var params = null;
    if (t.hasAttribute('data-params')) { try { params = JSON.parse(t.getAttribute('data-params')); } catch (err) { params = null; } }
    go(route, params);
  });

  var swipe = null;
  screensEl.addEventListener('pointerdown', function (e) {
    var s = e.target.closest('[data-swipe]');
    swipe = s ? { y: e.clientY, route: s.getAttribute('data-swipe') } : null;
  });
  screensEl.addEventListener('pointerup', function (e) {
    if (swipe && swipe.y - e.clientY > 40) go(swipe.route);
    swipe = null;
  });

  document.querySelectorAll('[data-jump]').forEach(function (b) {
    b.addEventListener('click', function () { reset(b.getAttribute('data-jump')); });
  });

  /* ---------- fit the 390x844 phone into the viewport ---------- */
  var stage = document.getElementById('stage');
  function fit() {
    var w = window.innerWidth, h = window.innerHeight;
    var phone = w <= 760;
    var s = phone ? Math.min(w / 390, h / 844) : Math.min(1, (h - 48) / 844);
    stage.style.transform = 'scale(' + s + ')';
    stage.style.margin = ((844 * s - 844) / 2) + 'px ' + ((390 * s - 390) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();

  var start = (location.hash || '').slice(1);
  reset(SCREENS[start] ? start : 'asosiy');
})();
</script>
